<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FunGals | Family Tree</title>
    <meta name="description" content="See how the FunGals are related: tap through the fungal family tree, from swimming chytrids to yeasts, molds and mushrooms." />
    <link rel="canonical" href="https://jessicasogge.github.io/fungals/family-tree.html" />
    <!-- How the link looks when it's shared (iMessage, Slack, Discord, social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FunGals" />
    <meta property="og:title" content="FunGals | Family Tree" />
    <meta property="og:description" content="See how the FunGals are related: tap through the fungal family tree, from swimming chytrids to yeasts, molds and mushrooms." />
    <meta property="og:url" content="https://jessicasogge.github.io/fungals/family-tree.html" />
    <meta property="og:image" content="https://jessicasogge.github.io/fungals/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Penelope, Sasha, Miri, Candi, Fumi, Olive and Yara, seven cartoon yeasts and molds, above the words FunGals: Grow your colony. Dodge antifungals." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <!-- The icon (and name) for "Add to Home Screen" on an iPhone or iPad. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FunGals" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="picker-page">
    <!-- "Growing the colony…" covers the page until game/family-tree.js has
         filled it in (see game/loading.js). -->
    <div class="loading-overlay arriving">
      <div class="loading-card" role="status">
        <span class="loading-cells" aria-hidden="true"><span></span><span></span></span>
        <span class="loading-text">Growing the colony…</span>
      </div>
    </div>
    <main class="picker-shell tree-shell">
      <h1>The FunGals Family Tree</h1>
      <p class="tree-lede">Tap a branch to go in. Tap a gal to see who her closest cousins are.</p>
      <!-- Where you are in the tree, from game/family-tree.js. Tap a step to go back up. -->
      <nav class="tree-trail" aria-label="Where you are in the tree"></nav>
      <p class="tree-note"></p>
      <!-- The branches (or gals) on this branch. -->
      <div class="tree-view" aria-live="polite"></div>
      <!-- The gal you tapped: her branches and her closest cousins. -->
      <section class="tree-gal" hidden aria-live="polite"></section>
      <p class="tree-simplified">The tree is simplified to show only the gals in the game.</p>
      <a class="back-link" href="./index.html">Back to home</a>
    </main>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./game/family-tree.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
